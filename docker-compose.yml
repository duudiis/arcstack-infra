services:
  frontend:
    build:
      context: ./arcstack-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${API_URL:-https://api.dudis.space}
        - NEXT_PUBLIC_WS_URL=${WS_URL:-wss://api.dudis.space}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcstack-frontend.entrypoints=web"
      - "traefik.http.routers.arcstack-frontend.rule=Host(`${FRONTEND_HOST:-preview.dudis.space}`)"
      - "traefik.http.services.arcstack-frontend.loadbalancer.server.port=3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-https://api.dudis.space}
      - NEXT_PUBLIC_WS_URL=${WS_URL:-wss://api.dudis.space}
    depends_on:
      - backend
    networks:
      - web
    restart: unless-stopped

  backend:
    build:
      context: ./arcstack-api
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcstack-backend.entrypoints=web"
      - "traefik.http.routers.arcstack-backend.rule=Host(`${API_HOST:-api.dudis.space}`)"
      - "traefik.http.services.arcstack-backend.loadbalancer.server.port=4000"
    environment:
      - DATABASE_URL=postgresql://arcstack:${DB_PASSWORD:-arcstack_dev}@postgres:5432/arcstack
      - REDIS_URL=redis://:${REDIS_PASSWORD:-arcstack_dev}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-jwt-secret-minimum-32-chars!}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars!}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=${NODE_ENV:-production}
      - FRONTEND_URL=${FRONTEND_URL:-https://preview.dudis.space}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.dudis.space}
      # AWS EC2 provisioning
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_AMI_ID=${AWS_AMI_ID}
      - AWS_SECURITY_GROUP_ID=${AWS_SECURITY_GROUP_ID}
      - AWS_SUBNET_ID=${AWS_SUBNET_ID}
      - AWS_KEY_PAIR_NAME=${AWS_KEY_PAIR_NAME}
      - AWS_INSTANCE_TYPE=${AWS_INSTANCE_TYPE:-t2.micro}
      - AGENT_WS_URL=${AGENT_WS_URL:-wss://api.dudis.space}
      - AGENT_REPO_URL=${AGENT_REPO_URL:-https://github.com/duudiis/arcstack-agent.git}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arcstack
      POSTGRES_USER: arcstack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arcstack_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcstack"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-arcstack_dev}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-arcstack_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

networks:
  web:
    driver: bridge
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
